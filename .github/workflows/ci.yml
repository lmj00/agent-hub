name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the repository's pinned pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install without changing the lockfile
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # Prebuild outside test timeouts so a cold image download is not a test failure.
      - name: Prepare container test images
        run: |
          docker build -f docker/analysis-runner.Dockerfile -t agent-hub-sandbox-test:local .
          docker build -t agent-hub-execution-test:local apps/server/tests/fixtures/container-runner
          docker build -f docker/verification-node.Dockerfile -t agent-hub-verification-node:local .
          docker build -f docker/operations-check.Dockerfile -t agent-hub-operations-test:local .
      - name: Load the scoped runner AppArmor profile
        run: sudo apparmor_parser -r apps/server/security/agent-hub-codex.apparmor
      - name: Test with real container boundaries and synthetic credentials
        # Direct output preserves GitHub's ::error annotations (recursive scripts add prefixes).
        shell: bash
        run: |
          pnpm --filter @agent-hub/server exec vitest run --reporter=default --reporter=github-actions 2>&1 | tee "$RUNNER_TEMP/server-tests.log"
          pnpm --filter @agent-hub/web exec vitest run tests --reporter=default --reporter=github-actions 2>&1 | tee "$RUNNER_TEMP/web-tests.log"
        env:
          RUN_CONTAINER_TESTS: "1"
      - name: Annotate test startup and worker failures
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { stripVTControlCharacters } from 'node:util';
          for (const name of ['server-tests.log', 'web-tests.log']) {
            const file = join(process.env.RUNNER_TEMP, name);
            if (!existsSync(file)) continue;
            const tail = stripVTControlCharacters(readFileSync(file, 'utf8')).slice(-7500);
            for (let offset = 0; offset < tail.length; offset += 2500) {
              const escaped = tail.slice(offset, offset + 2500).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
              process.stdout.write(`::error title=${name} part ${offset / 2500 + 1}::${escaped}\n`);
            }
          }
          JS
      - name: Install Chromium
        run: pnpm --filter @agent-hub/web exec playwright install --with-deps chromium
      - name: Test production service restart on the disposable Linux VM
        shell: bash
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" "$(command -v node)" scripts/check-systemd.mjs --disposable-github-runner 2>&1 | tee "$RUNNER_TEMP/systemd-tests.log"
      - name: Annotate service lifecycle failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const file = join(process.env.RUNNER_TEMP, 'systemd-tests.log');
          if (existsSync(file)) {
            const text = readFileSync(file, 'utf8').slice(-7500).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            process.stdout.write(`::error title=systemd lifecycle::${text}\n`);
          }
          JS
      - name: Retain synthetic Linux lifecycle and resource measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-lifecycle-${{ matrix.os }}
          path: ${{ runner.temp }}/systemd-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Test browser flows with the fake AI executor
        run: pnpm --filter @agent-hub/web test:browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-evidence-${{ matrix.os }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
